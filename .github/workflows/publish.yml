name: Publish Package

on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - ".gitignore"
  workflow_dispatch:

jobs:
  wasm-build-publish:
    name: Build & Publish WASM (${{ matrix.target }})
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read

    strategy:
      matrix:
        target: [bundler, web, nodejs]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup wasm-pack
        uses: qmaru/wasm-pack-action@v0.6.0
        with:
          version: latest

      - name: Run Tests
        run: cargo test

      - name: Rename package for web (only for web target)
        if: matrix.target == 'web'
        run: sed -i 's#name = "rtools"#name = "rtools-web"#g' Cargo.toml

      - name: Rename package for nodejs (only for nodejs target)
        if: matrix.target == 'nodejs'
        run: sed -i 's#name = "rtools"#name = "rtools-node"#g' Cargo.toml

      - name: Build WASM (${{ matrix.target }} target)
        run: wasm-pack build -t ${{ matrix.target }} --release --scope ${{ github.repository_owner }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: "https://npm.pkg.github.com"

      - name: Publish npm package
        run: |
          cd pkg
          npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
